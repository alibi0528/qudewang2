<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证书图片上传</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
  .container{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:600px;width:100%;padding:40px}
  h1{color:#2D5F8A;font-size:1.75rem;margin-bottom:8px;text-align:center}
  .subtitle{color:#6B7280;text-align:center;margin-bottom:24px}
  .success{background:#D5F5E3;border:2px solid #1E8449;color:#1E8449;border-radius:12px;padding:20px;margin-bottom:24px;text-align:center}
  .success h2{font-size:1.25rem;margin-bottom:8px}
  .success p{color:#2E3440;font-weight:600}
  .back-link{display:inline-block;margin-top:16px;color:#2D5F8A;text-decoration:none;font-weight:600}
  .back-link:hover{text-decoration:underline}
  .upload-section{border:2px dashed #E5E7EB;border-radius:16px;padding:30px;text-align:center;transition:all .3s}
  .upload-section:hover,.upload-section.dragover{border-color:#2D5F8A;background:#F0F7FF}
  .upload-icon{font-size:48px;margin-bottom:12px}
  .upload-text{color:#6B7280;margin-bottom:16px}
  .file-input{display:none}
  .upload-btn{background:linear-gradient(135deg,#2D5F8A,#4A8BC2);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
  .upload-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(45,95,138,0.3)}
  .file-list{margin-top:20px;text-align:left}
  .file-item{display:flex;align-items:center;gap:12px;padding:12px;background:#F7F9FC;border-radius:10px;margin-bottom:8px}
  .file-icon{font-size:24px}
  .file-info{flex:1;min-width:0}
  .file-name{font-weight:600;color:#2E3440;font-size:0.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-size{color:#6B7280;font-size:0.75rem}
  .start-btn{display:block;width:100%;margin-top:20px;background:linear-gradient(135deg,#F28E2B,#E67E22);color:#fff;border:none;border-radius:12px;padding:16px;font-size:1.125rem;font-weight:700;cursor:pointer;transition:all .2s}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(242,142,43,0.4)}
  .start-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
  .instructions{background:#FFF8E1;border-radius:10px;padding:16px;margin-bottom:24px}
  .instructions h3{color:#8B6914;margin-bottom:8px;font-size:0.9375rem}
  .instructions ol{padding-left:20px;color:#6B7280;font-size:0.875rem;line-height:1.8}
</style>
</head>
<body>
<div class="container">
  {% if uploaded %}
  <div class="success">
    <h2>🎉 上传成功！</h2>
    <p>已上传 {{ count }} 张证书图片</p>
    <a href="/" class="back-link">← 返回简历页面查看效果</a>
  </div>
  {% else %}
  <h1>📸 证书图片上传</h1>
  <p class="subtitle">为你的简历上传8张证书图片</p>
  
  <div class="instructions">
    <h3>📋 使用说明</h3>
    <ol>
      <li>点击下方按钮，选择一张证书图片</li>
      <li>每选好一张后，可以继续选下一张</li>
      <li>全部选好后，点击「开始上传」按钮</li>
      <li>上传完成后返回简历页面即可看到效果</li>
    </ol>
  </div>

  <form method="POST" action="/upload" enctype="multipart/form-data" id="uploadForm">
    <div class="upload-section" id="dropzone">
      <div class="upload-icon">📁</div>
      <p class="upload-text">点击选择 或 拖拽图片到此处</p>
      <input type="file" name="files" id="fileInput" accept="image/*" multiple class="file-input">
      <button type="button" class="upload-btn" id="browseBtn">选择图片</button>
    </div>
    
    <div class="file-list" id="fileList"></div>
    
    <button type="submit" class="start-btn" id="submitBtn" disabled>🚀 开始上传</button>
  </form>
  {% endif %}
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const browseBtn = document.getElementById('browseBtn');
const fileList = document.getElementById('fileList');
const submitBtn = document.getElementById('submitBtn');
const form = document.getElementById('uploadForm');

browseBtn.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    handleFiles(e.dataTransfer.files);
  }
});

fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

function handleFiles(files) {
  fileList.innerHTML = '';
  const fileArray = Array.from(files);
  
  fileArray.forEach((file, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <span class="file-icon">🖼️</span>
      <div class="file-info">
        <div class="file-name">${i+1}. ${file.name}</div>
        <div class="file-size">${(file.size/1024).toFixed(1)} KB</div>
      </div>
    `;
    fileList.appendChild(item);
  });
  
  submitBtn.disabled = fileArray.length === 0;
  submitBtn.textContent = fileArray.length > 0 
    ? `🚀 开始上传 (${fileArray.length} 张)` 
    : '🚀 开始上传';
}

form.addEventListener('submit', (e) => {
  const files = fileInput.files;
  if (files.length === 0) {
    e.preventDefault();
  }
});
</script>
</body>
</html>

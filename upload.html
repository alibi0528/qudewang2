<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证书图片上传</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 {
  text-align: center;
  color: #2D5F8A;
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: #6B7280;
  margin-bottom: 30px;
}
.cert-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.cert-item {
  display: flex;
  align-items: center;
  padding: 16px;
  background: #F9FAFB;
  border: 2px solid #E5E7EB;
  border-radius: 12px;
  transition: all 0.2s;
}
.cert-item:hover {
  border-color: #667eea;
  background: #F0F4FF;
}
.cert-info {
  flex: 1;
  min-width: 0;
}
.cert-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border-radius: 50%;
  font-weight: 700;
  font-size: 14px;
  margin-right: 12px;
  flex-shrink: 0;
}
.cert-name {
  font-size: 14px;
  font-weight: 600;
  color: #1F2937;
}
.cert-desc {
  font-size: 12px;
  color: #6B7280;
  margin-top: 2px;
}
.file-input {
  display: none;
}
.file-label {
  padding: 8px 16px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
}
.file-label:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}
.file-label.has-file {
  background: linear-gradient(135deg, #10B981, #059669);
}
.file-name {
  margin-left: 12px;
  font-size: 12px;
  color: #6B7280;
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.actions {
  margin-top: 30px;
  display: flex;
  gap: 16px;
  justify-content: center;
}
.btn {
  padding: 14px 28px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
}
.btn-secondary {
  background: #E5E7EB;
  color: #374151;
}
.btn-secondary:hover {
  background: #D1D5DB;
}
.tip {
  margin-top: 20px;
  padding: 14px;
  background: #FEF3C7;
  border: 1px solid #FDE68A;
  border-radius: 10px;
  font-size: 13px;
  color: #92400E;
  line-height: 1.6;
}
.tip strong { color: #78350F; }
#submitForm { display: inline; }
</style>
</head>
<body>
<div class="container">
  <h1>📎 证书图片上传</h1>
  <p class="subtitle">请为每项证书选择对应的图片文件</p>

  <div class="cert-list" id="certList"></div>

  <div class="actions">
    <a href="/" class="btn btn-secondary">← 返回简历</a>
    <form id="submitForm" action="/" method="POST" enctype="multipart/form-data">
      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>🚀 上传已选文件</button>
    </form>
  </div>

  <div class="tip">
    <strong>💡 小贴士：</strong><br>
    1. 点击每个证书右侧的"选择文件"按钮，选择对应的证书图片<br>
    2. 支持 JPG、PNG、GIF 格式<br>
    3. 选择完毕后，点击"上传已选文件"按钮<br>
    4. 上传成功后将自动返回简历页面
  </div>
</div>

<script>
const certs = [
  { name: '人工智能训练师证书（初级）', desc: 'AIT Junior Certificate' },
  { name: 'VISION人工智能设计（入门）', desc: 'Apsara Clouder - VISION入门' },
  { name: 'RAG应用构建及优化', desc: 'Apsara Clouder - RAG' },
  { name: '基于百炼平台构建智能体应用', desc: 'Apsara Clouder - 百炼' },
  { name: '人工智能训练师证书（高级）', desc: 'AIT Advanced Certificate' },
  { name: 'VISION人工智能设计（进阶）', desc: 'Apsara Clouder - VISION进阶' },
  { name: '基于PAI ArtLab的AIGC设计基础', desc: 'Apsara Clouder - PAI' },
  { name: '利用大模型提升内容生产能力', desc: 'Apsara Clouder - LLM内容' }
];

const certList = document.getElementById('certList');
const submitBtn = document.getElementById('submitBtn');
const submitForm = document.getElementById('submitForm');

certs.forEach((cert, i) => {
  const item = document.createElement('div');
  item.className = 'cert-item';
  item.innerHTML = `
    <div class="cert-info">
      <span class="cert-number">${i + 1}</span>
      <span style="vertical-align: middle;">
        <div class="cert-name">${cert.name}</div>
        <div class="cert-desc">${cert.desc}</div>
      </span>
    </div>
    <div style="display:flex;align-items:center;">
      <input type="file" id="file-${i}" class="file-input" accept="image/*" data-idx="${i}" name="files">
      <label for="file-${i}" class="file-label" id="label-${i}">📁 选择文件</label>
      <span class="file-name" id="name-${i}"></span>
    </div>
  `;
  certList.appendChild(item);

  const input = item.querySelector('.file-input');
  const label = item.querySelector('.file-label');
  const nameSpan = item.querySelector('.file-name');

  input.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      label.classList.add('has-file');
      label.textContent = '✓ 已选择';
      nameSpan.textContent = file.name;
      updateSubmitState();
    }
  });
});

function updateSubmitState() {
  const hasAny = certs.some((_, i) => document.getElementById(`file-${i}`).files[0]);
  submitBtn.disabled = !hasAny;
}

submitForm.addEventListener('submit', (e) => {
  e.preventDefault();
  
  const formData = new FormData();
  let hasFile = false;
  
  certs.forEach((_, i) => {
    const input = document.getElementById(`file-${i}`);
    if (input.files[0]) {
      formData.append('files', input.files[0], input.files[0].name);
      formData.append('cert_index', String(i));
      hasFile = true;
    }
  });
  
  if (!hasFile) return;
  
  submitBtn.disabled = true;
  submitBtn.textContent = '上传中...';
  
  fetch('/', {
    method: 'POST',
    body: formData
  })
  .then(resp => resp.json())
  .then(data => {
    if (data.success) {
      submitBtn.textContent = '✅ 上传成功！';
      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    } else {
      alert('上传失败: ' + (data.error || '未知错误'));
      submitBtn.disabled = false;
      submitBtn.textContent = '🚀 重新上传';
    }
  })
  .catch(err => {
    alert('上传失败: ' + err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = '🚀 重新上传';
  });
});
</script>
</body>
</html>

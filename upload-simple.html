<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>上传证书图片</title>
<style>
body{font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto}
h1{color:#2D5F8A}
.form-row{margin-bottom:15px;padding:10px;background:#f5f5f5;border-radius:8px}
label{display:block;font-weight:bold;margin-bottom:5px}
input[type=file]{display:block}
button{padding:12px 24px;background:#667eea;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
button:disabled{background:#ccc}
a{color:#667eea}
.tip{background:#FFF3CD;padding:12px;border-radius:8px;margin:15px 0;font-size:14px}
</style>
</head>
<body>
<h1>📎 证书图片上传</h1>
<p>选择证书图片文件并提交</p>

<form action="/" method="POST" enctype="multipart/form-data">
<div class="form-row">
<label>1. 人工智能训练师证书（初级）</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="0">
</div>

<div class="form-row">
<label>2. VISION人工智能设计（入门）</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="1">
</div>

<div class="form-row">
<label>3. RAG应用构建及优化</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="2">
</div>

<div class="form-row">
<label>4. 基于百炼平台构建智能体应用</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="3">
</div>

<div class="form-row">
<label>5. 人工智能训练师证书（高级）</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="4">
</div>

<div class="form-row">
<label>6. VISION人工智能设计（进阶）</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="5">
</div>

<div class="form-row">
<label>7. 基于PAI ArtLab的AIGC设计基础</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="6">
</div>

<div class="form-row">
<label>8. 利用大模型提升内容生产能力</label>
<input type="file" name="files" accept="image/*">
<input type="hidden" name="cert_index" value="7">
</div>

<button type="submit">🚀 上传</button>
</form>

<p style="margin-top:20px"><a href="/">← 返回简历</a></p>

<div class="tip">
<strong>💡 使用说明：</strong><br>
1. 每项独立提交：选择一张图片 → 点击"上传" → 页面会返回成功信息 → 再选择下一项<br>
2. 如果想一次性上传所有，请访问 <a href="/upload.html">新版上传页面</a>
</div>

<script>
// Simple redirect after successful upload
if (window.location.search.includes('success')) {
  document.body.innerHTML = '<h1>🎉 上传成功！</h1><p>正在返回简历页面...</p>';
  setTimeout(() => { window.location.href = '/'; }, 2000);
}
</script>
</body>
</html>

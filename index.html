<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2D5F8A;--primary-light:#4A8BC2;--primary-dark:#1C3A5E;
  --accent:#F28E2B;--accent-light:#F5A84E;
  --bg:#fff;--bg-card:#F7F9FC;--bg-nav:rgba(255,255,255,.92);
  --text:#2E3440;--text-muted:#6B7280;--text-light:#9CA3AF;
  --border:#E5E7EB;--shadow:0 4px 24px rgba(0,0,0,.08);--shadow-hover:0 8px 32px rgba(0,0,0,.12);
  --radius:12px;--radius-sm:8px;--transition:.2s cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --nav-h:56px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F172A;--bg-card:#1E293B;--bg-nav:rgba(15,23,42,.95);--text:#E2E8F0;--text-muted:#94A3B8;--text-light:#64748B;--border:#334155;--shadow:0 4px 24px rgba(0,0,0,.3);--shadow-hover:0 8px 32px rgba(0,0,0,.4)}}
[data-theme=dark]{--bg:#0F172A;--bg-card:#1E293B;--bg-nav:rgba(15,23,42,.95);--text:#E2E8F0;--text-muted:#94A3B8;--text-light:#64748B;--border:#334155;--shadow:0 4px 24px rgba(0,0,0,.3);--shadow-hover:0 8px 32px rgba(0,0,0,.4)}
[data-theme=light]{--bg:#fff;--bg-card:#F7F9FC;--bg-nav:rgba(255,255,255,.92);--text:#2E3440;--text-muted:#6B7280;--text-light:#9CA3AF;--border:#E5E7EB;--shadow:0 4px 24px rgba(0,0,0,.08);--shadow-hover:0 8px 32px rgba(0,0,0,.12)}

html{scroll-behavior:smooth;scroll-padding-top:var(--nav-h);-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition);overflow-x:hidden}
a{color:var(--primary);text-decoration:none;transition:color var(--transition)}
a:hover{color:var(--accent)}
img{max-width:100%;display:block}
button{font-family:inherit}

/* Nav — mobile: horizontal scroll links */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--bg-nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:1000;transition:all var(--transition)}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 12px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-brand{font-size:1.125rem;font-weight:700;color:var(--primary);letter-spacing:-.5px;white-space:nowrap;flex-shrink:0}
.nav-links{display:flex;gap:4px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;justify-content:center}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{padding:10px 12px;border-radius:20px;font-size:.8125rem;font-weight:500;color:var(--text-muted);transition:all var(--transition);cursor:pointer;border:none;background:none;white-space:nowrap;min-height:44px;display:flex;align-items:center;flex-shrink:0}
.nav-link:hover,.nav-link.active{color:var(--primary);background:rgba(45,95,138,.1)}
.nav-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.nav-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);font-size:1rem;flex-shrink:0}
.nav-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Hero — mobile sizes */
.hero{padding:calc(var(--nav-h) + 40px) 16px 40px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;margin-bottom:16px;box-shadow:0 8px 32px rgba(45,95,138,.3)}
.hero h1{font-size:1.75rem;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;line-height:1.3}
.hero h1 span{color:var(--primary)}
.hero .subtitle{font-size:1rem;color:var(--text-muted);margin-bottom:12px}
.hero .tagline{font-size:.875rem;color:var(--text-muted);max-width:600px;margin-bottom:20px;line-height:1.8}
.hero-contact{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.contact-btn{display:inline-flex;align-items:center;gap:6px;padding:12px 16px;border-radius:24px;font-size:.8125rem;font-weight:500;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;transition:all var(--transition);min-height:48px}
.contact-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.hero-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:500;background:linear-gradient(135deg,rgba(45,95,138,.1),rgba(45,95,138,.05));color:var(--primary);border:1px solid rgba(45,95,138,.15)}

/* Section — mobile padding */
.section{padding:40px 16px;max-width:1100px;margin:0 auto}
.section-title{font-size:1.25rem;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:24px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--accent))}

/* Highlights — mobile: 2 cols */
.highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.highlight-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:all var(--transition);position:relative;overflow:hidden}
.highlight-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));transform:scaleX(0);transition:transform var(--transition);transform-origin:left}
.highlight-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.highlight-card:hover::before{transform:scaleX(1)}
.highlight-num{font-size:1.75rem;font-weight:800;color:var(--primary);line-height:1}
.highlight-label{font-size:.75rem;color:var(--text-muted);margin-top:4px}

/* Tabs */
.tabs-wrapper{margin-bottom:24px}
.tab-nav{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 16px;border:none;background:none;cursor:pointer;font-size:.875rem;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all var(--transition);white-space:nowrap;min-height:48px}
.tab-btn:hover{color:var(--primary)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-panel{display:none;animation:fadeIn .3s ease}
.tab-panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Timeline */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--primary),var(--accent));border-radius:1px}
.timeline-item{position:relative;margin-bottom:24px}
.timeline-item::before{content:'';position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid var(--bg);box-shadow:0 0 0 3px var(--primary)}
.timeline-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.timeline-title{font-size:1rem;font-weight:600}
.timeline-meta{font-size:.75rem;color:var(--text-muted);display:flex;gap:12px;align-items:center}
.timeline-body ul{list-style:none;padding:0}
.timeline-body li{position:relative;padding-left:16px;margin-bottom:6px;font-size:.875rem;color:var(--text)}
.timeline-body li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:700}

/* Project cards — mobile: 1 col */
.project-grid{display:grid;grid-template-columns:1fr;gap:16px}
.project-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all var(--transition);display:flex;flex-direction:column}
.project-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.project-card h4{font-size:1rem;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.project-card h4::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--accent)}
.project-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.project-tag{padding:2px 10px;border-radius:12px;font-size:.7rem;font-weight:500;background:rgba(242,142,43,.1);color:var(--accent)}
.project-card p{font-size:.875rem;color:var(--text-muted);flex:1}

/* Skills — mobile: 1 col */
.skills-grid{display:grid;grid-template-columns:1fr;gap:20px}
.skill-category h4{font-size:.9375rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.skill-category h4::before{content:'';width:3px;height:18px;border-radius:2px;background:var(--accent)}
.skill-bar-wrap{margin-bottom:12px}
.skill-bar-header{display:flex;justify-content:space-between;font-size:.8125rem;margin-bottom:4px}
.skill-bar-label{font-weight:500}
.skill-bar-pct{color:var(--text-muted)}
.skill-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.skill-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* Education & Certs — mobile: 1 col */
.edu-grid{display:grid;grid-template-columns:1fr;gap:16px}
.edu-card,.cert-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all var(--transition)}
.edu-card:hover,.cert-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.edu-card h4,.cert-card h4{font-size:1rem;font-weight:600;margin-bottom:4px}
.edu-card .meta,.cert-card .meta{font-size:.75rem;color:var(--text-muted);margin-bottom:8px}
.cert-thumb{position:relative;display:block;margin:-20px -20px 12px;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0;max-height:200px;cursor:pointer;background:linear-gradient(135deg,#E8F4FD,#D6EAF8 50%,#EBF5FB)}
.cert-thumb img{width:100%;height:200px;object-fit:cover;object-position:center top;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.cert-thumb:hover img{transform:scale(1.04)}
.cert-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:200px;padding:16px;text-align:center}
.cert-fallback .fb-icon{font-size:2.5rem;margin-bottom:8px;opacity:.5}
.cert-fallback .fb-text{font-size:.8125rem;font-weight:600;color:var(--primary-dark);line-height:1.4}
.cert-fallback .fb-sub{font-size:.7rem;color:var(--text-muted);margin-top:4px}
.cert-badge{position:absolute;top:10px;right:10px;z-index:2;padding:3px 8px;border-radius:12px;font-size:.65rem;font-weight:600;background:rgba(255,255,255,.92);color:var(--primary-dark);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cert-expiry{display:inline-block;margin-top:8px;font-size:.7rem;font-weight:500;padding:3px 10px;border-radius:12px;background:rgba(45,95,138,.08);color:var(--primary)}
.cert-expand{position:fixed;inset:0;z-index:2000;display:none;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px}
.cert-expand.show{display:flex;animation:fadeIn .2s ease}
.cert-expand img{max-width:95vw;max-height:92vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cert-expand-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.cert-expand-close:hover{background:rgba(255,255,255,.25)}

/* Footer */
.footer{text-align:center;padding:32px 16px;font-size:.75rem;color:var(--text-muted);border-top:1px solid var(--border);margin-top:32px}

/* Back to top — touch friendly */
.back-top{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:1.25rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(45,95,138,.3);opacity:0;transform:translateY(20px);transition:all var(--transition);pointer-events:none;z-index:999}
.back-top.visible{opacity:1;transform:translateY(0);pointer-events:auto}
.back-top:hover{background:var(--accent);transform:translateY(-2px)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary-dark);color:#fff;padding:10px 24px;border-radius:24px;font-size:.8125rem;font-weight:500;opacity:0;pointer-events:none;transition:all .3s ease;z-index:1001}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(24px);transition:all .6s cubic-bezier(.4,0,.2,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* Print */
@media print{.nav,.back-top,.tab-btn,.hero-badges,.contact-btn,.nav-actions{display:none!important}.nav{position:static!important;height:auto!important}.tab-panel{display:block!important;page-break-inside:avoid}.tab-panel:not(:first-child){margin-top:24px}body{background:#fff;color:#000}.hero{padding-top:40px}.section{padding:24px 0}.highlight-card,.project-card,.edu-card,.cert-card{break-inside:avoid;border:none;box-shadow:none}.skill-bar-fill{background:var(--primary)!important}}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:instant!important}}

/* ===== Tablet & Desktop (min-width:768px) ===== */
@media(min-width:768px){
  :root{--nav-h:64px}
  .nav-inner{padding:0 24px}
  .nav-brand{font-size:1.25rem}
  .nav-link{padding:6px 14px;font-size:.875rem;min-height:auto}
  .nav-btn{width:36px;height:36px}
  .hero{padding:120px 24px 60px}
  .hero-avatar{width:100px;height:100px;font-size:2.5rem;margin-bottom:20px}
  .hero h1{font-size:2.5rem;letter-spacing:-1px}
  .hero .subtitle{font-size:1.125rem}
  .hero .tagline{font-size:1rem}
  .hero-contact{gap:10px;margin-bottom:28px}
  .contact-btn{padding:8px 18px;font-size:.875rem;min-height:auto}
  .badge{padding:5px 14px;font-size:.8rem}
  .section{padding:60px 24px}
  .section-title{font-size:1.5rem;margin-bottom:32px}
  .section-title::before{height:28px}
  .highlights{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
  .highlight-card{padding:24px}
  .highlight-num{font-size:2.25rem}
  .highlight-label{font-size:.875rem}
  .tab-btn{padding:10px 20px;font-size:.9375rem;min-height:auto}
  .timeline{padding-left:24px}
  .timeline-item::before{left:-28px}
  .timeline-title{font-size:1.125rem}
  .timeline-meta{font-size:.8125rem}
  .timeline-body li{font-size:.9375rem}
  .project-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
  .project-card{padding:24px}
  .project-card h4{font-size:1.0625rem}
  .project-card p{font-size:.9375rem}
  .skills-grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
  .skill-category h4{font-size:1rem}
  .skill-bar-header{font-size:.875rem}
  .edu-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
  .edu-card,.cert-card{padding:24px}
  .edu-card h4,.cert-card h4{font-size:1.0625rem}
  .edu-card .meta,.cert-card .meta{font-size:.8125rem}
  .cert-thumb{margin:-24px -24px 16px;max-height:220px}
  .cert-thumb img{height:220px}
  .cert-fallback{height:220px}
  .cert-badge{top:12px;right:12px;padding:4px 10px;font-size:.7rem}
  .cert-expiry{font-size:.75rem}
  .footer{padding:40px 24px;font-size:.8125rem}
  .back-top{bottom:30px;right:30px}
  .toast{font-size:.875rem}
}
</style>
</head>

function renderHeroBadges(){const t=resume.skills,e=document.getElementById("heroBadges"),a=[];Object.values(t).forEach(r=>r.forEach(s=>a.push(s.name.split("（")[0].split("/")[0].trim())));e.innerHTML=[...new Set(a.slice(0,8))].map(s=>`<span class="badge">${s}</span>`).join("")}
function renderHighlights(){document.getElementById("highlightsGrid").innerHTML=resume.highlights.map(h=>`<div class="highlight-card reveal"><div class="highlight-num">${h.num}</div><div class="highlight-label">${h.label}</div></div>`).join("")}
function renderExperience(){const c=resume.experience.campus,co=resume.experience.course;document.getElementById("panel-campus").innerHTML=`<div class="timeline-item"><div class="timeline-header"><div><div class="timeline-title">${c.title}</div><div class="timeline-meta"><span>${c.role}</span></div></div><div class="timeline-meta"><span>${c.period}</span></div></div><div class="timeline-body"><ul>${c.items.map(i=>`<li>${i}</li>`).join("")}</ul></div></div>`;document.getElementById("panel-course").innerHTML=`<div class="timeline-item"><div class="timeline-header"><div><div class="timeline-title">${co.title}</div><div class="timeline-meta"><span>${co.role}</span></div></div><div class="timeline-meta"><span>${co.period}</span></div></div><div class="timeline-body"><ul>${co.items.map(i=>`<li>${i}</li>`).join("")}</ul></div></div>`}
function renderProjects(){document.getElementById("projectGrid").innerHTML=resume.projects.map(p=>`<div class="project-card reveal"><h4>${p.name}</h4><div class="project-tags">${p.tags.map(t=>`<span class="project-tag">${t}</span>`).join("")}</div><p>${p.desc}</p></div>`).join("")}
function renderSkills(){document.getElementById("skillsGrid").innerHTML=Object.entries(resume.skills).map(([c,skills])=>`<div class="skill-category reveal"><h4>${c}</h4>${skills.map(s=>`<div class="skill-bar-wrap"><div class="skill-bar-header"><span class="skill-bar-label">${s.name}</span><span class="skill-bar-pct">${s.level}%</span></div><div class="skill-bar"><div class="skill-bar-fill" data-width="${s.level}"></div></div></div>`).join("")}</div>`).join("")}
function renderEducation(){const e=resume.education;const cards=resume.certificates.map((c,i)=>`<div class="cert-card reveal" data-cert-idx="${i}"><div class="cert-thumb" data-cert-img="${c.img}.jpg"><picture><source type="image/webp" srcset="${c.img}.webp"><source type="image/jpeg" srcset="${c.img}.jpg"><img src="${c.img}.jpg" alt="${c.name}" loading="lazy" decoding="async" data-cert-idx="${i}"></picture><span class="cert-badge">证书</span></div><h4>${c.name}</h4><div class="meta">${c.org}</div><span class="cert-expiry">有效期至 ${c.validUntil}</span></div>`).join("");document.getElementById("eduGrid").innerHTML=`<div class="edu-card reveal"><h4>${e.school}</h4><div class="meta">${e.major} · ${e.degree}</div></div>${cards}`;initCertExpand()}

function initCertExpand(){
  const thumbs=document.querySelectorAll(".cert-thumb");
  let overlay=document.querySelector(".cert-expand");
  if(!overlay){overlay=document.createElement("div");overlay.className="cert-expand";overlay.innerHTML='<button class="cert-expand-close" aria-label="关闭">✕</button><img alt="证书大图">';document.body.appendChild(overlay)}
  const overlayImg=overlay.querySelector("img"),closeBtn=overlay.querySelector(".cert-expand-close");
  thumbs.forEach(thumb=>thumb.addEventListener("click",()=>{
    if(thumb.dataset.hasImg==="false")return;
    overlayImg.src=thumb.dataset.certImg;overlay.classList.add("show");
  }));
  const close=()=>{overlay.classList.remove("show");overlayImg.src=""};
  closeBtn.addEventListener("click",close);
  overlay.addEventListener("click",e=>{if(e.target===overlay)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
}

function initTabs(){const btns=document.querySelectorAll(".tab-btn");btns.forEach(btn=>{btn.addEventListener("click",()=>{btns.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-selected","false")});document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));btn.classList.add("active");btn.setAttribute("aria-selected","true");document.getElementById("panel-"+btn.dataset.tab).classList.add("active")})})}
function initNavScroll(){const sections=document.querySelectorAll("section[id]"),links=document.querySelectorAll(".nav-link");let ticking=!1;window.addEventListener("scroll",()=>{if(ticking)return;ticking=!0,requestAnimationFrame(()=>{let cur="";sections.forEach(s=>{if(window.scrollY>=s.offsetTop-80)cur=s.id});links.forEach(l=>l.classList.toggle("active",l.dataset.target===cur));ticking=!1})},{passive:!0})}
function initBackTop(){const btn=document.getElementById("backTop");let ticking=!1;window.addEventListener("scroll",()=>{if(ticking)return;ticking=!0,requestAnimationFrame(()=>{btn.classList.toggle("visible",window.scrollY>400);ticking=!1})},{passive:!0});btn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}))}
function initTheme(){const btn=document.getElementById("themeToggle"),saved=localStorage.getItem("theme");if(saved){document.documentElement.setAttribute("data-theme",saved);btn.textContent=saved==="dark"?"🌙":"☀️"}else if(window.matchMedia("(prefers-color-scheme:dark)").matches){document.documentElement.setAttribute("data-theme","dark");btn.textContent="🌙"}btn.addEventListener("click",()=>{const cur=document.documentElement.getAttribute("data-theme"),next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);localStorage.setItem("theme",next);btn.textContent=next==="dark"?"🌙":"☀️"})}
function initPrint(){document.getElementById("printBtn").addEventListener("click",()=>window.print())}
function initCopy(){const toast=document.getElementById("toast");document.querySelectorAll(".contact-btn").forEach(btn=>btn.addEventListener("click",()=>{const text=btn.dataset.copy;navigator.clipboard.writeText(text).then(()=>{toast.textContent="已复制："+text;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2e3)}).catch(()=>{toast.textContent="复制失败，请手动复制";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2e3)})}))}
function initReveal(){const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");e.target.querySelectorAll(".skill-bar-fill").forEach(b=>b.style.width=b.dataset.width+"%")}})},{threshold:.15});document.querySelectorAll(".reveal").forEach(el=>obs.observe(el))}

document.addEventListener("DOMContentLoaded",()=>{renderHeroBadges();renderHighlights();renderExperience();renderProjects();renderSkills();renderEducation();initTabs();initNavScroll();initBackTop();initTheme();initPrint();initCopy();initReveal()});
</script>

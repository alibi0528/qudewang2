/* ========== 一键复制（轻量文本反馈） ========== */
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(resolve => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    resolve();
  });
}

function initCopy() {
  document.querySelectorAll('.copy-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      if (chip.dataset.busy) return;
      chip.dataset.busy = '1';
      const label = chip.querySelector('.chip-label');
      const icon = chip.querySelector('.chip-icon');
      const iconCheck = chip.querySelector('.chip-icon-check');
      const original = label.textContent;

      copyText(chip.dataset.copy).then(() => {
        label.textContent = '已复制';
        icon.classList.add('hidden');
        iconCheck.classList.remove('hidden');
        setTimeout(() => {
          label.textContent = original;
          icon.classList.remove('hidden');
          iconCheck.classList.add('hidden');
          delete chip.dataset.busy;
        }, 1600);
      }).catch(() => {
        label.textContent = '复制失败';
        setTimeout(() => { label.textContent = original; delete chip.dataset.busy; }, 1600);
      });
    });
  });
}

/* ========== 入场动效 & 技能条 ========== */
function initReveal() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        entry.target.querySelectorAll('.skill-bar-fill').forEach(bar => {
          bar.style.transition = 'width .8s cubic-bezier(.4,0,.2,1)';
          bar.style.width = bar.dataset.width + '%';
        });
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

/* ========== 打印前确保技能条填充 ========== */
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.skill-bar-fill').forEach(bar => {
    bar.style.transition = 'none';
    bar.style.width = bar.dataset.width + '%';
  });
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
});

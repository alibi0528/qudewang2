/* ========== Tab Logic ========== */
function initTabs() {
  const tabBtns = document.querySelectorAll('.tab-btn');
  const activeCls = 'bg-gradient-to-r from-cyan-500/90 to-indigo-500/90 text-white font-semibold shadow-[0_0_18px_rgba(34,211,238,0.25)]';
  const idleCls = 'text-slate-400';
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => {
        b.classList.remove('active', ...activeCls.split(' '));
        b.classList.add(...idleCls.split(' '));
        b.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      btn.classList.add('active', ...activeCls.split(' '));
      btn.classList.remove(...idleCls.split(' '));
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
    });
    btn.addEventListener('keydown', (e) => {
      const tabs = Array.from(tabBtns);
      const idx = tabs.indexOf(btn);
      let next = idx;
      if (e.key === 'ArrowRight') next = (idx + 1) % tabs.length;
      if (e.key === 'ArrowLeft') next = (idx - 1 + tabs.length) % tabs.length;
      if (next !== idx) { tabs[next].click(); tabs[next].focus(); }
    });
  });
}

/* ========== Nav Active State ========== */
function initNavScroll() {
  const sections = document.querySelectorAll('section[id]');
  const navLinks = document.querySelectorAll('.nav-link');
  const update = () => {
    let current = '';
    sections.forEach(sec => {
      if (window.scrollY >= sec.offsetTop - 120) current = sec.id;
    });
    navLinks.forEach(link => {
      const active = link.dataset.target === current;
      link.classList.toggle('text-cyan-300', active);
      link.classList.toggle('bg-white/[0.06]', active);
      link.classList.toggle('text-slate-400', !active);
    });
  };
  window.addEventListener('scroll', update);
  update();
}

/* ========== Back to Top ========== */
function initBackTop() {
  const btn = document.getElementById('backTop');
  window.addEventListener('scroll', () => {
    const visible = window.scrollY > 400;
    btn.classList.toggle('opacity-0', !visible);
    btn.classList.toggle('pointer-events-none', !visible);
  });
  btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

/* ========== Print ========== */
function initPrint() {
  document.getElementById('printBtn').addEventListener('click', () => window.print());
}

/* ========== Copy to Clipboard + Toast ========== */
function initCopy() {
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let timer;
  document.querySelectorAll('.contact-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const text = btn.dataset.copy;
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast(`已复制：${text}`); }
        catch (e) { showToast('复制失败，请手动复制'); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(`已复制：${text}`))
          .catch(fallback);
      } else {
        fallback();
      }
    });
  });
  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }
}

/* ========== Scroll Reveal ========== */
function initReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        entry.target.querySelectorAll('.skill-bar-fill').forEach(bar => {
          bar.style.width = bar.dataset.width + '%';
        });
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

/* ========== Init ========== */

  lucide.createIcons();
  initTabs();
  initNavScroll();
  initBackTop();
  initPrint();
  initCopy();
  initReveal();
});
